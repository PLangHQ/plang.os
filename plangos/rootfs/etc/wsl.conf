# PlangOS: WSL distro config. Read by WSL when the distro starts.
#
# The container is sealed: it reaches Windows only through host plang,
# over the channel host plang opened when it started the container.

[user]
# `wsl -d PlangOS` starts this user's passwd "shell", which is plang.
default = plang

[interop]
# The container cannot start Windows programs, and gets no Windows PATH.
enabled = false
appendWindowsPath = false

[automount]
# No /mnt/c. Windows files are reached only through requests to host plang.
enabled = false
mountFsTab = false

[network]
generateResolvConf = true
generateHosts = true

# No [boot] command: nothing runs at distro start. Host plang starts plang
# as the `plang` user; a boot command would run a second plang as root.
