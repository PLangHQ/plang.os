<!doctype html>
<!-- PlangOS's desktop, first version. Chromium draws it as an app window (no tabs, no toolbar)
     the size of the screen, under every other window. Opening an app opens a window of its own. -->
<html lang="is">
<head>
<meta charset="utf-8">
<title>PlangOS</title>
<style>
  :root {
    --bar: rgba(12, 18, 28, .72);
    --glass: rgba(255, 255, 255, .08);
    --line: rgba(255, 255, 255, .14);
    --text: #eef2f7;
    --dim: #9fb0c3;
    --accent: #f2a33a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 15px/1.4 system-ui, "Segoe UI", "DejaVu Sans", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 78% 18%, rgba(242, 163, 58, .22), transparent 60%),
      radial-gradient(900px 600px at 12% 88%, rgba(56, 189, 190, .20), transparent 60%),
      linear-gradient(160deg, #0d1b2a 0%, #13293d 55%, #0b1520 100%);
    user-select: none;
  }

  /* desktop icons, top left, in columns */
  .icons {
    position: absolute; top: 24px; left: 24px; bottom: 80px;
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 104px);
    grid-auto-columns: 96px; gap: 8px 12px;
  }
  .icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 4px; border-radius: 10px; cursor: default; text-align: center;
  }
  .icon:hover { background: var(--glass); }
  .icon:active { background: rgba(255, 255, 255, .16); }
  .tile {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 700; font-size: 22px; color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .tile img { width: 44px; height: 44px; }
  .icon span { font-size: 13px; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }

  /* the middle: time, date, and where to go */
  .home {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; width: 640px;
  }
  .time { font-size: 112px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
  .date { font-size: 22px; color: var(--dim); margin-top: 8px; }
  .date::first-letter { text-transform: uppercase; }
  form { margin-top: 40px; }
  input {
    width: 100%; padding: 16px 22px; font: inherit; font-size: 18px; color: var(--text);
    background: rgba(255, 255, 255, .10); border: 1px solid var(--line); border-radius: 999px;
    outline: none; backdrop-filter: blur(12px);
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: var(--accent); background: rgba(255, 255, 255, .14); }

  /* taskbar */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    display: flex; align-items: center; gap: 6px; padding: 0 12px;
    background: var(--bar); border-top: 1px solid var(--line); backdrop-filter: blur(20px);
  }
  .bar button {
    height: 42px; min-width: 42px; padding: 0 12px; border: 0; border-radius: 8px;
    display: flex; align-items: center; gap: 8px; color: var(--text); font: inherit;
    background: transparent;
  }
  .bar button:hover { background: var(--glass); }
  .bar .start img { width: 30px; height: 30px; }
  .bar .start b { font-weight: 600; letter-spacing: .3px; }
  .bar .pin .tile { width: 28px; height: 28px; border-radius: 7px; font-size: 13px; box-shadow: none; }
  .spacer { flex: 1; }
  /* one button per open window */
  .windows { display: flex; gap: 4px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); overflow: hidden; }
  .windows button { max-width: 220px; min-width: 120px; justify-content: flex-start; background: rgba(255, 255, 255, .05); position: relative; }
  .windows button span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
  .windows button.active { background: rgba(255, 255, 255, .16); }
  .windows button.active::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 2px; height: 3px; border-radius: 2px; background: var(--accent); }
  .windows button.minimized span { color: var(--dim); }
  .tray { text-align: right; font-size: 13px; line-height: 1.25; padding: 0 8px; }
  /* how the screen feels: input → picture, p50; a click shows the rest */
  .bar .kpi { font-size: 13px; font-variant-numeric: tabular-nums; gap: 6px; }
  .kpi i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .kpi.good i { background: #4ade80; } .kpi.fair i { background: var(--accent); } .kpi.slow i { background: #e5484d; }
  .menu.stats { left: auto; right: 12px; width: 340px; }
  .stats table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats th { text-align: left; font-weight: 500; color: var(--dim); padding: 4px 0; white-space: nowrap; }
  .stats td { text-align: right; padding: 4px 0 4px 12px; white-space: nowrap; }
  .stats small { display: block; margin-top: 10px; color: var(--dim); font-size: 12px; }
  .tray small { color: var(--dim); }

  /* start menu */
  .menu {
    position: absolute; left: 12px; bottom: 64px; width: 360px; padding: 16px;
    background: rgba(16, 24, 36, .92); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .5); backdrop-filter: blur(24px);
  }
  .menu h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  .menu .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .menu .about { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 13px; }
  .menu .about img { width: 40px; height: 40px; }

  /* right-click menu */
  .menu.context { bottom: auto; width: 250px; padding: 6px; border-radius: 10px; }
  .context button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
    border: 0; border-radius: 6px; background: transparent; color: var(--text); font: inherit; font-size: 14px; text-align: left;
  }
  .context button:hover { background: var(--glass); }
  .context button i { width: 18px; font-style: normal; text-align: center; color: var(--dim); }
  .context hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .context .swatches { display: flex; gap: 8px; padding: 2px 10px 8px 38px; }
  .context .swatches span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); }
  .context .swatches span:hover { border-color: var(--dim); }
  .context .swatches span.on { border-color: var(--text); }
  .icons.gone { visibility: hidden; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="icons" id="icons"></div>

<div class="home">
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
  <form id="go"><input id="where" placeholder="Leita eða slá inn vefslóð" autocomplete="off" autofocus></form>
</div>

<div class="menu stats" id="stats" hidden>
  <h2>Skjárinn</h2>
  <table>
    <tr><th>ms</th><td>p50</td><td>p85</td><td>p95</td></tr>
    <tr><th>Inntak → mynd</th><td id="p-picture-50">–</td><td id="p-picture-85">–</td><td id="p-picture-95">–</td></tr>
    <tr><th>Leiðslan, fram og til baka</th><td id="p-pipe-50">–</td><td id="p-pipe-85">–</td><td id="p-pipe-95">–</td></tr>
  </table>
  <table style="margin-top:8px">
    <tr><th>Uppfærslur á sekúndu</th><td id="s-updates">–</td></tr>
    <tr><th>Gögn</th><td id="s-mb">–</td></tr>
    <tr><th>Tími að teikna</th><td id="s-apply">–</td></tr>
  </table>
  <small>Mælt á Windows: frá smelli eða takka þar til myndin sem svarar er komin, í ms.</small>
</div>

<div class="menu" id="menu" hidden>
  <h2>Forrit</h2>
  <div class="apps" id="apps"></div>
  <div class="about"><img src="plang.png" alt=""><div><b style="color:var(--text)">PlangOS</b><br>Only PLang runs here.</div></div>
</div>

<div class="menu context" id="context" hidden></div>

<div class="bar">
  <button class="start" id="start"><img src="plang.png" alt=""><b>PlangOS</b></button>
  <div id="pins" style="display:flex;gap:2px"></div>
  <div class="windows" id="windows"></div>
  <div class="spacer"></div>
  <button class="kpi" id="kpi" title="Frá inntaki að mynd (p50)"><i></i><span>– ms</span></button>
  <div class="tray"><div id="clock"></div><small id="day"></small></div>
</div>

<script>
  // The apps: for now web pages. Later these come from PLang (apps installed in PlangOS).
  const apps = [
    { name: 'Vísir', url: 'https://www.visir.is', color: '#d7263d', mark: 'V', pin: true },
    { name: 'mbl.is', url: 'https://www.mbl.is', color: '#1d4e89', mark: 'm', pin: true },
    { name: 'RÚV', url: 'https://www.ruv.is', color: '#0b7a75', mark: 'R', pin: true },
    { name: 'Wikipedia', url: 'https://is.wikipedia.org', color: '#444c56', mark: 'W' },
    { name: 'YouTube', url: 'https://www.youtube.com', color: '#e62117', mark: '▶', pin: true },
    { name: 'Veður', url: 'https://www.vedur.is', color: '#2f80ed', mark: '☁' },
    { name: 'PLang', url: 'https://plang.is', logo: true },
  ];

  const tile = a => a.logo
    ? `<div class="tile" style="background:#fff"><img src="plang.png" alt=""></div>`
    : `<div class="tile" style="background:${a.color}">${a.mark}</div>`;
  // The desktop talks to PlangOS's plang: plang(text) asks, a 'message' event from origin 'plang' tells.
  const ask = message => window.plang ? window.plang(JSON.stringify(message)) : console.warn('no plang', message);
  const open = url => { if (!menu.hidden) showMenu(false); ask({ open: url }); };   // a window of its own

  // what the user chose (wallpaper, pins, icons hidden) is kept in this browser's storage
  const kept = (key, fallback) => { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };
  const keep = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { } };

  const icons = document.getElementById('icons');
  const menuApps = document.getElementById('apps');
  const pins = document.getElementById('pins');
  let pinned = new Set(kept('pinned', apps.filter(a => a.pin).map(a => a.name)));
  for (const a of apps) {
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.innerHTML = tile(a) + `<span>${a.name}</span>`;
    icon.ondblclick = () => open(a.url);      // desktop: double-click opens
    icon.oncontextmenu = e => iconMenu(e, a);
    icons.append(icon);

    const item = icon.cloneNode(true);
    item.onclick = () => open(a.url);         // start menu: one click
    menuApps.append(item);
  }
  function showPins() {
    pins.replaceChildren(...apps.filter(a => pinned.has(a.name)).map(a => {
      const pin = document.createElement('button');
      pin.className = 'pin';
      pin.title = a.name;
      pin.innerHTML = tile(a);
      pin.onclick = () => open(a.url);
      pin.oncontextmenu = e => iconMenu(e, a);
      return pin;
    }));
  }
  showPins();

  // Panels that open from the taskbar: the start menu, the screen's numbers. The desktop is under
  // every window; while a panel is open the screen shows that part of the desktop above them (the
  // taskbar always is). One at a time.
  const menu = document.getElementById('menu');
  const stats = document.getElementById('stats');
  let panel = null;
  function showPanel(el) {
    if (panel && panel !== el) panel.hidden = true;
    panel = el;
    if (el) el.hidden = false;
    const r = el?.getBoundingClientRect();
    ask(el ? { window: 'above', id: 0, x: Math.floor(r.left), y: Math.floor(r.top), w: Math.ceil(r.width), h: Math.ceil(r.height) }
           : { window: 'above', id: 0, w: 0 });
  }
  function closePanel() {
    if (!panel) return;
    panel.hidden = true;
    showPanel(null);
  }
  const toggle = el => e => { e.stopPropagation(); if (panel === el) closePanel(); else showPanel(el); };
  document.getElementById('start').onclick = toggle(menu);
  document.getElementById('kpi').onclick = toggle(stats);
  document.addEventListener('click', e => { if (panel && !panel.contains(e.target)) closePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
  window.addEventListener('blur', closePanel);   // a window was clicked
  const showMenu = open => open ? showPanel(menu) : closePanel();

  // Right-click: PlangOS's own menu, not Chromium's (the search field keeps Chromium's: cut, copy,
  // paste). On the desktop: what the desktop can do; on an app: open it, pin it to the taskbar.
  const context = document.getElementById('context');
  const wallpapers = [
    { name: 'Kvöld', css: getComputedStyle(document.body).backgroundImage, swatch: 'linear-gradient(135deg, #13293d 30%, #f2a33a)' },
    { name: 'Norðurljós', css: 'radial-gradient(1100px 600px at 30% 18%, rgba(74, 222, 128, .24), transparent 60%), radial-gradient(900px 600px at 80% 70%, rgba(168, 85, 247, .22), transparent 60%), linear-gradient(170deg, #06121f 0%, #0b2233 60%, #050b14 100%)', swatch: 'linear-gradient(135deg, #0b2233, #4ade80 55%, #a855f7)' },
    { name: 'Haf', css: 'radial-gradient(1000px 700px at 70% 25%, rgba(56, 189, 248, .26), transparent 60%), linear-gradient(180deg, #0a2540 0%, #0e3a5c 55%, #06182b 100%)', swatch: 'linear-gradient(135deg, #0a2540 30%, #38bdf8)' },
    { name: 'Sandur', css: 'radial-gradient(1000px 600px at 22% 25%, rgba(242, 163, 58, .30), transparent 60%), linear-gradient(160deg, #2b1d14 0%, #3d2a1c 55%, #1a120c 100%)', swatch: 'linear-gradient(135deg, #3d2a1c 30%, #f2a33a)' },
  ];
  let wallpaper = kept('wallpaper', 'Kvöld');
  const paper = () => document.body.style.backgroundImage = (wallpapers.find(w => w.name === wallpaper) ?? wallpapers[0]).css;
  paper();
  let iconsHidden = kept('iconsHidden', false);
  icons.classList.toggle('gone', iconsHidden);

  function item(glyph, label, act) {
    const b = document.createElement('button');
    b.innerHTML = `<i>${glyph}</i><span></span>`;
    b.lastChild.textContent = label;
    b.onclick = e => { e.stopPropagation(); closePanel(); act(); };
    return b;
  }
  const line = () => document.createElement('hr');
  function swatches() {
    const row = document.createElement('div');
    row.className = 'swatches';
    for (const w of wallpapers) {
      const s = document.createElement('span');
      s.title = w.name;
      s.style.backgroundImage = w.swatch;
      s.classList.toggle('on', w.name === wallpaper);
      s.onclick = e => {
        e.stopPropagation();
        wallpaper = w.name; keep('wallpaper', wallpaper); paper();
        row.querySelectorAll('span').forEach(x => x.classList.toggle('on', x === s));
      };
      row.append(s);
    }
    return row;
  }
  // the menu where the pointer is, kept on the screen above the taskbar
  function popUp(e, ...entries) {
    e.preventDefault();
    e.stopPropagation();
    context.replaceChildren(...entries);
    context.hidden = false;
    const w = context.offsetWidth, h = context.offsetHeight;
    context.style.left = Math.max(8, Math.min(e.clientX, innerWidth - w - 8)) + 'px';
    context.style.top = Math.max(8, Math.min(e.clientY, innerHeight - 56 - h - 8)) + 'px';
    showPanel(context);
  }
  document.addEventListener('contextmenu', e => {
    if (e.target.closest('input') || context.contains(e.target)) return;
    const where = document.getElementById('where');
    const showing = [...windows].filter(([, w]) => !w.minimized);
    const label = document.createElement('div');
    label.style.cssText = 'padding:4px 10px 2px 38px;font-size:12px;color:var(--dim)';
    label.textContent = 'Veggfóður';
    popUp(e,
      item('⚲', 'Leita eða opna vefsíðu', () => { where.focus(); where.select(); }),
      item('▭', 'Sýna skjáborðið', () => showing.forEach(([id]) => ask({ window: 'minimize', id }))),
      line(),
      label, swatches(),
      item('▦', iconsHidden ? 'Sýna táknin' : 'Fela táknin', () => { iconsHidden = !iconsHidden; keep('iconsHidden', iconsHidden); icons.classList.toggle('gone', iconsHidden); }),
      line(),
      item('◔', 'Skjárinn: mælingar', () => showPanel(stats)),
      item('↻', 'Endurhlaða skjáborðið', () => location.reload()),
      item('ℹ', 'Um PlangOS', () => showPanel(menu)));
  });
  function iconMenu(e, a) {
    const on = pinned.has(a.name);
    popUp(e,
      item('↗', `Opna ${a.name}`, () => open(a.url)),
      item('★', on ? 'Losa af verkstikunni' : 'Festa á verkstikuna', () => {
        if (on) pinned.delete(a.name); else pinned.add(a.name);
        keep('pinned', [...pinned]);
        showPins();
      }));
  }

  // the screen's numbers, from the host once a second: input → picture (the taskbar shows its p50),
  // the pipe's round trip, updates/s, MB/s, time to draw
  const kpi = document.getElementById('kpi');
  function numbers(s) {
    const p50 = s.picture?.p50 ?? -1;
    kpi.className = 'kpi ' + (p50 < 0 ? '' : p50 <= 25 ? 'good' : p50 <= 60 ? 'fair' : 'slow');
    kpi.lastChild.textContent = p50 < 0 ? `${Math.round(s.updates)}/s` : `${p50} ms`;
    for (const kind of ['picture', 'pipe'])
      for (const p of [50, 85, 95]) {
        const v = s[kind]?.['p' + p] ?? -1;
        document.getElementById(`p-${kind}-${p}`).textContent = v < 0 ? '–' : v;
      }
    document.getElementById('s-updates').textContent = Math.round(s.updates);
    document.getElementById('s-mb').textContent = s.mb.toFixed(2) + ' MB/s';
    document.getElementById('s-apply').textContent = s.apply.toFixed(1) + ' ms';
  }

  // search or address
  document.getElementById('go').onsubmit = e => {
    e.preventDefault();
    const q = document.getElementById('where').value.trim();
    if (!q) return;
    const looksLikeUrl = /^[a-z]+:\/\//i.test(q) || (/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(q));
    open(looksLikeUrl ? (/^[a-z]+:\/\//i.test(q) ? q : 'https://' + q)
                      : 'https://duckduckgo.com/?q=' + encodeURIComponent(q));
  };

  // the open windows, as the screen reports them: {"window":"opened|titled|focused|minimized|
  // maximized|restored|closed","id",…}. id 0 is this desktop.
  const windows = new Map();   // id → { title, minimized }
  let active = 0;
  const bar = document.getElementById('windows');
  function show() {
    bar.replaceChildren(...[...windows].map(([id, w]) => {
      const b = document.createElement('button');
      b.className = (id === active && !w.minimized ? 'active' : '') + (w.minimized ? ' minimized' : '');
      b.title = w.title;
      b.innerHTML = '<span></span>';
      b.firstChild.textContent = w.title || 'Gluggi';
      // like Windows: the active window minimizes, any other comes forward
      b.onclick = () => ask({ window: id === active && !w.minimized ? 'minimize' : 'focus', id });
      return b;
    }));
  }
  window.addEventListener('message', e => {
    if (e.origin !== 'plang') return;
    const m = JSON.parse(e.data);
    if (m.stats) { numbers(m.stats); return; }
    const w = windows.get(m.id);
    switch (m.window) {
      case 'opened': windows.set(m.id, { title: m.title || '', minimized: false }); break;
      case 'titled': if (w) w.title = m.title; break;
      case 'focused': active = m.id; if (w) w.minimized = false; break;
      case 'minimized': if (w) w.minimized = true; if (active === m.id) active = 0; break;
      case 'restored': if (w) w.minimized = false; break;
      case 'closed': windows.delete(m.id); if (active === m.id) active = 0; break;
    }
    show();
  });

  // clock
  const time = document.getElementById('time'), date = document.getElementById('date');
  const clock = document.getElementById('clock'), day = document.getElementById('day');
  // Icelandic by hand: PlangOS's Chromium has no Icelandic locale data
  const days = ['sunnudagur', 'mánudagur', 'þriðjudagur', 'miðvikudagur', 'fimmtudagur', 'föstudagur', 'laugardagur'];
  const months = ['janúar', 'febrúar', 'mars', 'apríl', 'maí', 'júní', 'júlí', 'ágúst', 'september', 'október', 'nóvember', 'desember'];
  const two = n => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    const hm = two(now.getHours()) + ':' + two(now.getMinutes());
    time.textContent = hm;
    clock.textContent = hm;
    date.textContent = `${days[now.getDay()]} ${now.getDate()}. ${months[now.getMonth()]}`;
    day.textContent = `${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear()}`;
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
