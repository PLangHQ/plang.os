# PlangOS package selection. Read by build.sh.
#
# snapshot  - snapshot.debian.org timestamp. Every package comes from this one
#             point in time, so the same lock resolves to the same bytes forever.
# root      - what we ask for. apt resolves the dependency closure (Depends +
#             Pre-Depends, no Recommends) starting from an EMPTY system.
# deny      - in the closure but never unpacked. Each one says why.
# helper    - unpacked only while building (to generate caches), then removed.
#
# Nothing runs a maintainer script. The rootfs is assembled with dpkg-deb -x,
# so every file in the image comes from a .deb listed in packages.lock or from
# plangos/rootfs/.

snapshot 20260928T000000Z
suite    trixie

# --- what PlangOS is ------------------------------------------------------------
root chromium          # the browser (stage 3 renders with it; shipped from stage 1)
root libc6 libgcc-s1 libstdc++6 zlib1g   # .NET self-contained runtime needs these
root libssl3t64        # .NET crypto + TLS
root ca-certificates   # TLS trust roots (bundle generated at build, see build.sh)
root tzdata            # TimeZoneInfo
root fonts-dejavu-core # at least one font, or Chromium draws boxes

# --- in the closure, never unpacked ---------------------------------------------
# init / services: PlangOS has no init system and runs no daemons.
deny systemd systemd-sysv sysvinit-utils init-system-helpers libsystemd-shared lsb-base
deny dbus dbus-bin dbus-daemon dbus-session-bus-common dbus-system-bus-common dbus-user-session
deny dconf-service     # a D-Bus service; GSettings falls back to its memory backend
# login / PAM: nobody logs in. WSL starts plang as the passwd "shell".
deny libpam-modules libpam-modules-bin libpam-runtime libpam-systemd
# package management: no dpkg state, no debconf in the image.
deny debconf
# executables with no job here (shell scripts, admin tools, CLIs).
deny mawk mount procps x11-utils xdg-utils openssl
# build-time generators: run as helpers, not shipped.
deny gtk-update-icon-cache shared-mime-info fontconfig
# x11-common is only an init script + dirs.
deny x11-common
# Mesa GL drivers (LLVM alone is 124 MB). Chromium renders on the CPU with
# --disable-gpu and has its own SwiftShader; libgbm loads drivers on demand, it
# does not link them. checks.sh verifies no shipped ELF needs a denied library.
deny libgl1-mesa-dri mesa-libgallium libllvm19 libz3-4 libglx-mesa0

# --- build helpers ---------------------------------------------------------------
helper libc-bin        # ldconfig -> /etc/ld.so.cache
helper fontconfig      # fc-cache -> font cache
helper libglib2.0-bin  # glib-compile-schemas -> gschemas.compiled (GTK aborts without it)
