[package]
name = "plang-screen"
version = "0.1.0"
edition = "2021"
description = "PlangOS's display: a minimal headless Wayland compositor that streams changed rectangles and takes input as JSON lines"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
serde_json = "1"
base64 = "0.22"
qoi = "0.4.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
