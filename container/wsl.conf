# WSL distro config for plangOS server.
# Applied when the rootfs tarball is registered via `wsl --import`.

[boot]
# Run plang as the default boot command. WSL has no PID 1 reaper of its own,
# but plang is a single-process .NET app; no zombies to reap.
command = /opt/plang/plang

[user]
default = plang

[automount]
# Off: the image has no mount binary (busybox stripped), so 'mount -a' fails
# at boot. If a goal ever needs Windows file access, mount paths into the
# distro explicitly with `wsl -d plangos --cd <path>` or similar at run time.
enabled = false

[network]
generateResolvConf = true
generateHosts = true

[interop]
# Keep "only PLang runs" intact: no Windows binaries in PATH inside the distro.
enabled = false
appendWindowsPath = false
