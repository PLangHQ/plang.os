# WSL distro config for plangOS desktop.
# Applied when the rootfs tarball is registered via `wsl --import`.

[boot]
# When the WSL distro starts, run plangd as the default command.
# WSLg sockets are mounted automatically by WSL at /mnt/wslg, and
# DISPLAY/WAYLAND_DISPLAY are set by WSL before this command runs.
command = /opt/plang/plangd

[user]
default = plang

[automount]
# Mount Windows drives at /mnt/c, /mnt/d, etc. so PLang apps can read
# user files without explicit mount flags.
enabled = true
options = "metadata,uid=10001,gid=10001,umask=22,fmask=11"

[network]
# Generate /etc/resolv.conf and /etc/hosts at boot. No hostname change.
generateResolvConf = true
generateHosts = true

[interop]
# Don't expose Windows binaries in PATH inside the distro. Keeps the
# "only PLang runs" guarantee — no fall-through to Windows tools.
enabled = false
appendWindowsPath = false
